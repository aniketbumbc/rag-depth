<!doctype html>
<meta charset="utf-8" />
<title>Tour RAG</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  input {
    width: 75%;
    padding: 0.5rem;
  }
  button {
    padding: 0.5rem 1rem;
  }
  #status {
    color: #666;
    font-size: 0.9rem;
    min-height: 1.2rem;
  }
  #answer {
    white-space: pre-wrap;
    margin: 1rem 0;
    line-height: 1.5;
  }
  #sources {
    color: #444;
    font-size: 0.9rem;
  }
</style>

<form id="f">
  <input id="q" placeholder="Ask about the tour" required maxlength="500" />
  <button>Ask</button>
</form>
<div id="status"></div>
<div id="answer"></div>
<ul id="sources"></ul>

<script>
  const $ = (id) => document.getElementById(id);
  let text = '';

  function handle(event, d) {
    if (event === 'status') $('status').textContent = d.message + '...';
    if (event === 'token') {
      text += d.text;
      $('answer').textContent = text;
    } // textContent, never innerHTML
    if (event === 'reset') {
      text = '';
      $('answer').textContent = '';
    }
    if (event === 'sources') {
      $('sources').innerHTML = '';
      d.sources.forEach((s) => {
        const li = document.createElement('li');
        li.textContent = `[${s.n}] ${s.section} (p${s.page})`;
        $('sources').appendChild(li);
      });
    }
    if (event === 'done') $('status').textContent = `Done (${d.path})`;
    if (event === 'error') $('status').textContent = d.message;
  }

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    text = '';
    $('answer').textContent = '';
    $('sources').innerHTML = '';

    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: $('q').value }),
    });
    if (!res.ok) {
      $('status').textContent = (await res.json()).error ?? 'Request failed';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(frame)?.[1];
        const data = /^data: (.*)$/m.exec(frame)?.[1];
        if (ev && data) handle(ev, JSON.parse(data));
      }
    }
  });
</script>
